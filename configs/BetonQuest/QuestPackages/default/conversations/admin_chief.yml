conversations:
  admin_chief:
    quester: "행정실장"
    first: start
    NPC_options:
      start:
        text: "&8[행정실장]&f 학생증 가져왔어? 뭐, 상관없지. 우리 행정실은 돈과 실력만 있으면 누구에게나 평등한 장비를 팔아주니까 말이야. 살 거 없으면 빨리 가!"
        pointers: end_ok
      q_end:
        text: "&7[시스템]&f 대화가 종료되었습니다."
    player_options:
      end_ok:
        text: "[대화를 마친다]"
        pointers: q_end
