conversations:
  vice_principal:
    quester: "교감선생님"
    first: start
    NPC_options:
      start:
        text: "&e[교감선생님]&f 인천과학고등학교 입학을 환영한다네, 신입생! 이곳은 단순한 학교가 아니라 생존의 전장이지. 리로스쿨 인증으로 동아리 소속은 이미 구별되어 있으니, 각오 단단히 하라고."
        pointers: end_ok
      q_end:
        text: "&7[시스템]&f 대화가 종료되었습니다."
    player_options:
      end_ok:
        text: "[대화를 마친다]"
        pointers: q_end
