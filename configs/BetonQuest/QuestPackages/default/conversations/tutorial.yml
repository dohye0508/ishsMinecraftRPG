conversations:
  tutorial:
    quester: "교감선생님"
    first: start
    
    NPC_options:
      start:
        text: "&e[교감선생님]&f 인천과학고등학교 입학을 환영한다네, 신입생! 리로스쿨 인증 후 동아리 선택은 잘 마쳤겠지?"
        pointers: player_yes,player_no
      
      guide_skill:
        text: "&e[교감선생님]&f 방금 선택한 동아리의 고유 스킬은 &a&lShift + F&f (웅크리고 양손 교체)를 누르면 발동된다네! 마나가 소모되니 신중히 사용하게."
        pointers: player_ask_weapon
      
      guide_weapon:
        text: "&e[교감선생님]&f 학교 밖 숲에는 방사능 토끼와 오작동 드론들이 출몰하니, 우선 내가 주는 연습용 목검을 받아서 실습에 나서게나!"
        events: finish_tutorial_event
      
    player_options:
      player_yes:
        text: "네! 인증과 동아리 선택을 마쳤습니다. 스킬은 어떻게 쓰나요?"
        pointers: guide_skill
      
      player_ask_weapon:
        text: "감사합니다! 이제 무엇을 해야 하나요?"
        pointers: guide_weapon
      
      player_no:
        text: "죄송합니다. 나중에 다시 올게요."
