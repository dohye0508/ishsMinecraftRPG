conversations:
  dorm2:
    quester: "2학년 사감쌤"
    first: start
    NPC_options:
      start:
        text: "&e[2학년 사감선생님]&f 이제 2학년쯤 됐으면 학교 밖이 얼마나 험한지 알겠지? 네 실력을 증명할 겸 다이아몬드 광석 1개쯤은 네 손으로 캐와봐라."
        pointers: accept,q_no
      q_accept:
        text: "그 기백이 언제까지 갈지 두고 보마. 안 지켜오면 벌점이다!!"
        events: start_dorm2_quest
    player_options:
      accept:
        text: "자신 있습니다! 다녀오겠습니다!"
        pointers: q_accept
      q_no:
        text: "도망간다."
