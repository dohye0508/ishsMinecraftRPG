conversations:
  logic_buzzang:
    quester: "LOGIC 부짱"
    first: start
    NPC_options:
      start:
        text: "&b[LOGIC 부짱]&f 짱님이 말씀하신 그 뉴비가 바로 너로군! 여기서 빈둥댈 시간은 없다. 우리 LOGIC의 더러운 실무는 지금부터 네가 담당하게 될 거니까."
        pointers: quest1,q_no
      q1:
        text: "&b[LOGIC 부짱]&f 첫 임무다. 야외에 나다니는 녀석들의 뼈를 분석해야 해. 좀비를 3마리 처치하고 오라고. 어때, 해낼 자신은 있겠지?"
        pointers: accept,q_no
      q_accept:
        text: "&b[LOGIC 부짱]&f 좋아. 임무를 마치면 철 주괴 5개을 쥐어 주겠다. 임무 시작이다!"
        events: start_logic_quest
    player_options:
      quest1:
        text: "네! 당장 임무를 주십시오!"
        pointers: q1
      accept:
        text: "임무를 완수하고 돌아오겠습니다."
        pointers: q_accept
      q_no:
        text: "아직 준비가 안 됐습니다."
