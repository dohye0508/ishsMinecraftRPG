conversations:
  quasar_buzzang:
    quester: "QUASAR 부짱"
    first: start
    NPC_options:
      start:
        text: "&b[QUASAR 부짱]&f 짱님이 말씀하신 그 뉴비가 바로 너로군! 여기서 빈둥댈 시간은 없다. 우리 QUASAR의 더러운 실무는 지금부터 네가 담당하게 될 거니까."
        pointers: quest1,q_no
      q1:
        text: "&b[QUASAR 부짱]&f 첫 임무다. 우주 관측소를 지을 건축 자재가 부족해. 돌(Stone) 32개를 캐와!. 어때, 해낼 자신은 있겠지?"
        pointers: accept,q_no
      q_accept:
        text: "&b[QUASAR 부짱]&f 좋아. 임무를 마치면 다이아몬드 1개을 쥐어 주겠다. 임무 시작이다!"
        events: start_quasar_quest
    player_options:
      quest1:
        text: "네! 당장 임무를 주십시오!"
        pointers: q1
      accept:
        text: "임무를 완수하고 돌아오겠습니다."
        pointers: q_accept
      q_no:
        text: "아직 준비가 안 됐습니다."
