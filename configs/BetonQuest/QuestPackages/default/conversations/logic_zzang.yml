conversations:
  logic_zzang:
    quester: "LOGIC 짱"
    first: start
    NPC_options:
      start:
        text: "&c[LOGIC 짱]&f 크큭... 드디어 도착했나. 네가 그 소문으로 듣던 녀석 맞지? 우리 LOGIC은 수식과 벡터의 힘으로 닥쳐오는 적들의 움직임을 미리 예측하는 위대한 동아리다. 다른 밥통 같은 녀석들과는 달라도 한참 다르다는 걸 내 곁에서 똑똑히 목격하도록 해라!"
        pointers: q1,q_no
      q1:
        text: "&c[LOGIC 짱]&f 그래, 눈빛이 살아있군! 앞으로 더 강해지고 싶다면 거점 전투에서 피를 좀 봐야 할 거다. 준비가 되면 부짱에게 가서 실전 감각을 쌓고 와라!"
        pointers: accept,q_no
      q_accept:
        text: "&c[LOGIC 짱]&f 그래, 마음에 든다. 당장 부짱 녀석에게 가서 실무 퀘스트나 실컷 받아 내라!"
    player_options:
      q1:
        text: "전투요? 어떻게 살아남아야 할까요?"
        pointers: q1
      accept:
        text: "옙, 명심하겠습니다!"
        pointers: q_accept
      q_no:
        text: "[조용히 물러난다]"
