# ============================================================
#  커스텀 아이템 목록 (기획팀이 직접 수정하는 파일)
# ============================================================
#  - 이름과 설명(lore)에는 색상 코드를 쓸 수 있습니다. 앞에 & 를 붙입니다.
#      &0 검정  &1 남색  &2 초록  &3 청록  &4 진빨강  &5 보라  &6 금색  &7 회색
#      &8 진회색 &9 파랑  &a 연두  &b 하늘  &c 빨강    &d 분홍  &e 노랑  &f 흰색
#  - 값을 고친 뒤 게임에서 OP가  /설정리로드  를 입력하면 적용됩니다.
#    (이미 플레이어가 가진 아이템의 이름/설명은 바뀌지 않고, 새로 지급하는 아이템부터 바뀝니다)
#  - 아이템 지급:  /아이템지급 [플레이어] [아이템ID]
#
#  [중요] 아이템의 "효과"는 아이템ID에 코드가 연결되어 있습니다.
#    demerit_card     공격 적중 시 대상 약화 (쿨타임 6초)
#    wanil_staff      효과 없음 (겉모습만)
#    jasmine_flower   우클릭 시 체력 회복 (소모품)
#    schema           우클릭 시 힘/이동속도 증가 90초 (소모품)
#    changbong_spear  공격 적중 시 대상을 밀쳐냄
#    changbong_rod    공격 적중 시 대상을 하늘로 띄움
#  위 ID의 이름, 재료, 설명은 자유롭게 바꿀 수 있지만 ID 자체를 바꾸면 효과가 사라집니다.
#  새 ID를 추가하면 "효과 없는 장식용 아이템"이 만들어집니다. (효과는 개발자에게 요청)
#
#  항목 설명
#    material    아이템 재료 (마인크래프트 영어 이름, 대문자. 예: PAPER, STICK, DIAMOND_SWORD)
#    name        아이템 이름
#    lore        설명문. 한 줄이 목록 하나입니다. 빈 줄은 ""
#    unbreakable true면 내구도가 닳지 않음
# ============================================================

items:
  demerit_card:
    material: PAPER
    name: "&c왕사감의 벌점카드"
    lore:
      - "&7왕사감 선생님의 위압적인 손길이 담긴 카드."
      - "&7이 카드에 찍히는 자, 정신이 아득해진다."
      - ""
      - "&4공격 적중 시 대상에게 약화 효과 부여"
    unbreakable: true

  wanil_staff:
    material: STICK
    name: "&b완일쌤의 지팡이"
    lore:
      - "&7평범해 보이지만 완일쌤의 손때가 묻은 무기."
      - "&7특별한 힘은 없지만 그 자체로 믿음직스럽다."
    unbreakable: true

  jasmine_flower:
    material: AZURE_BLUET
    name: "&d자스민 꽃"
    lore:
      - "&7으깨어 상처에 바르면 통증이 가라앉는다."
      - ""
      - "&d우클릭 시 체력 회복 (소모품)"
    unbreakable: false

  schema:
    material: BOOK
    name: "&6스키마"
    lore:
      - "&7정신을 각성시키는 비전의 공식."
      - ""
      - "&6우클릭 시 일정 시간 무기 강화 및 이동속도 증가 (소모품)"
    unbreakable: false

  changbong_spear:
    material: TRIDENT
    name: "&3이창봉도 창이다"
    lore:
      - "&7이창봉 선생님의 이름처럼, 이 창도 창이다."
      - ""
      - "&3공격 적중 시 대상을 강하게 찔러 밀쳐낸다"
    unbreakable: true

  changbong_rod:
    material: BLAZE_ROD
    name: "&6이창봉도 봉이다"
    lore:
      - "&7이창봉 선생님의 이름처럼, 이 봉도 봉이다."
      - ""
      - "&6공격 적중 시 대상을 후려쳐 하늘로 띄운다"
    unbreakable: true
