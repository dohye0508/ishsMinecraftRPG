# ============================================================
#  플레이어에게 보이는 문구 (기획팀이 직접 수정하는 파일)
# ============================================================
#  - 색상은 & + 글자로 씁니다.
#      &0 검정  &1 남색  &2 초록  &3 청록  &4 진빨강  &5 보라  &6 금색  &7 회색
#      &8 진회색 &9 파랑  &a 연두  &b 하늘  &c 빨강    &d 분홍  &e 노랑  &f 흰색
#      &l 굵게  &o 기울임  &r 색/서식 초기화
#  - {이름} 처럼 중괄호로 둘러싼 부분은 게임이 값을 채워 넣는 자리입니다. 지우거나 이름을 바꾸지 마세요.
#      예) {player}는 플레이어 이름, {level}은 레벨로 바뀝니다. 각 항목 위의 설명에 쓸 수 있는 자리가 적혀 있습니다.
#  - 값이 목록(- 로 시작하는 여러 줄)인 항목은 한 줄씩 차례로 보여 줍니다. 빈 줄은 "" 로 적습니다.
#  - 값을 고친 뒤 게임에서 OP가  /설정리로드  를 입력하면 적용됩니다.
#  - 키 이름(왼쪽)을 바꾸거나 지우면 문구가 키 이름 그대로 보이고 서버 콘솔에 경고가 나옵니다.
#  - 도움말은 help.yml, 도전과제 문구는 achievements.yml, 아이템 사용 메시지는 items.yml 에 있습니다.
# ============================================================


# ---- 공통 ----
common:
  players-only: "&c플레이어만 사용할 수 있는 명령어입니다."
  no-permission: "&c권한이 없습니다."


# ---- 레벨업 ----
# {level} 새 레벨, {player} 플레이어 이름
level-up:
  title: "&6&l★ LEVEL UP! ★ &eLv.{level} 달성!"
  hint: "&7스탯이 자동으로 상승했습니다."
  broadcast: "&b[서버] &f{player}&e 님이 Lv.{level} 에 도달했습니다! 🎉"


# ---- 입장 제한 (/입장허용) ----
entry:
  # 입장이 막혀 있을 때 접속하려는 사람에게 보이는 화면
  denied:
    - "&c&l⛔ 입장 제한"
    - ""
    - "&f서버가 활성화됐지만"
    - "&f관리자가 아직 입장을 허용하지 않았습니다."
    - ""
    - "&7잠시 후 다시 접속해주세요."
  status: "&e현재 입장 상태: {state}"          # {state} 아래 둘 중 하나
  state-open: "&a허용"
  state-closed: "&c차단 (관리자만 입장 가능)"
  usage: "&7사용법: /입장허용 [열기|닫기]"
  usage-error: "&c사용법: /입장허용 [열기|닫기]"
  # 명령어 뒤에 붙이는 단어. 위 사용법 문구에 적힌 단어와 같게 맞춰 주세요.
  keyword-open: "열기"
  keyword-close: "닫기"
  opened: "&a[시스템] 이제부터 모든 플레이어의 입장이 허용됩니다."
  closed: "&c[시스템] 관리자(OP) 외 모든 플레이어의 입장이 차단됩니다. (이미 접속중인 인원은 유지)"


# ---- 건축 제한 ----
build:
  no-break: "&c블록을 부술 권한이 없습니다."
  no-place: "&c블록을 설치할 권한이 없습니다."


# ---- 스탯 포인트 획득 알림 (화면 아래쪽에 잠깐 표시) ----
# {points} 받은 포인트
reward:
  mining-stat-point: "&b채광/벌목 중 스탯 포인트를 {points} 발견했습니다!"
  kill-stat-point: "&6마력 스탯 포인트를 {points} 획득했습니다!"
  pvp-win: "&b전투 승리 보상으로 스탯 포인트 {points}를 획득했습니다!"


# ---- 동아리 ----
# 동아리 이름, 아이콘, 보너스 수치는 clubs.yml 에서 수정합니다.
club:
  gui-title: "동아리(직업) 선택"
  # GUI 아이템 설명. {bonuses} 는 보너스 목록으로 바뀝니다.
  bonus-lore: "&7{bonuses}"
  bonus-entry: "{stat} +{amount}"      # 보너스 하나. {stat} 스탯 이름, {amount} 올라가는 양
  bonus-separator: ", "                # 보너스 사이 구분
  must-auth: "&c먼저 /인증 을 완료해야 합니다."
  current: "&e현재 소속: {club}"        # {club} 동아리 이름 (없으면 아래 current-none)
  current-none: "없음"
  usage: "&7/club <가입|탈퇴> [동아리명]"
  leave-none: "&c가입한 동아리가 없습니다."
  left: "&e{club} 동아리에서 탈퇴했습니다."
  joined: "&a{club} 동아리에 가입했습니다."
  must-choose: "&c반드시 동아리를 선택해야 합니다!"
  # /club 명령어 뒤에 붙이는 탈퇴 단어. 위 usage 문구에 적힌 단어와 같게 맞춰 주세요.
  keyword-leave: "탈퇴"


# ---- 스탯 (/stat) ----
stat:
  gui-title: "스탯 정보"
  gui-player: "&b{player}"                               # 위쪽 정보 아이템 이름
  gui-stat: "&f현재 {label}: {value}"                     # {label} 스탯 이름, {value} 현재 값
  gui-hint: "&7좌클릭: +{click} | Shift+좌클릭: +{shift}"   # 클릭 한 번에 올라가는 양
  # 위쪽 정보 아이템 설명. {level} 레벨, {exp} 현재 경험치, {exp-required} 필요 경험치, {points} 남은 스탯 포인트
  gui-info:
    - "&f레벨: {level}"
    - "&f경험치: {exp} / {exp-required}"
    - "&f스탯 포인트: {points}"
  not-enough-points: "&c스탯 포인트가 부족합니다."
  # 화면 아래쪽에 항상 보이는 체력/마나 표시. {hp} {max-hp} {mp} {max-mp}
  actionbar: "&c❤ HP: {hp}/{max-hp}  &7|  &b🔮 MP: {mp}/{max-mp}"


# ---- 로비 (/lobby) ----
lobby:
  in-combat: "&c전투 중에는 로비로 이동할 수 없습니다!"
  moved: "&a★ &f로비로 이동했습니다!"


# ---- 퀘스트 (/퀘스트) ----
quest:
  placeholderapi-missing: "&c퀘스트 정보를 불러올 수 없습니다. (PlaceholderAPI 미설치)"
  header: "&6==== [ 📜 진행중인 퀘스트 ] ===="
  entry: "&f• {name}&e (남음: {left})"      # {name} 퀘스트 이름, {left} 남은 횟수
  none: "&7현재 진행 중인 퀘스트가 없습니다. NPC에게 말을 걸어보세요!"
  footer: "&6==============================="


# ---- 아이템 지급 (/아이템지급) ----
item:
  usage: "&e사용법: /아이템지급 [플레이어] [아이템ID]"
  id-list: "&7아이템ID: {ids}"
  player-not-found: "&c플레이어를 찾을 수 없습니다: {player}"
  unknown-item: "&c존재하지 않는 아이템ID입니다: {id}"
  received: "&a[시스템] {item}&a 아이템을 지급받았습니다!"        # {item} 아이템 이름
  given: "&a{player}님에게 {item}&a 아이템을 지급했습니다."


# ---- 설정 다시 불러오기 (/설정리로드, 관리자 전용) ----
reload:
  done: "&a[시스템] 설정 파일을 다시 불러왔습니다."
  auth: "&7 - 리로스쿨 인증: {state}"
  auth-on: "사용 (다음 접속부터 적용)"
  auth-off: "끔"
  border: "&7 - 맵 경계: {state}"
  border-range: "x {min-x}~{max-x}, z {min-z}~{max-z}"
  border-off: "끔"
  spawn: "&7 - 최초 스폰: {x}, {y}, {z}"
  content: "&7 - 아이템 {items}종, 도전과제 {achievements}개, 동아리 {clubs}개 불러옴"
  betonquest: "&7BetonQuest(대화/퀘스트) 수정은 /bq reload 로 따로 적용하세요."
  npc: "&7 - NPC {count}명 반영 (npcs.yml)"
  npc-missing: "&c - NPC 를 반영하지 못했습니다. Citizens 플러그인을 확인하세요."


# ---- NPC (/엔피씨, 관리자 전용) ----
npc:
  usage:
    - "&e/엔피씨 추가 [키] [이름]&7 - 지금 서 있는 곳에 NPC 추가 (키는 영어 소문자, 예: library_teacher)"
    - "&e/엔피씨 이동 [키]&7 - NPC 를 지금 서 있는 곳(바라보는 방향 포함)으로 옮김"
    - "&e/엔피씨 삭제 [키]&7 - NPC 삭제"
    - "&e/엔피씨 목록&7 - npcs.yml 의 NPC 목록"
    - "&7이름, 스킨 수정은 npcs.yml 을 고친 뒤 /설정리로드"
  list-header: "&6[NPC] 총 {count}명"
  list-line: "&7 - &e{key}&7 ({name}&7) {x}, {y}, {z} / 대화: {conversation}"
  bad-key: "&c'{key}' 는 쓸 수 없는 키입니다. 영어 소문자, 숫자, 밑줄만 쓸 수 있습니다."
  already-exists: "&c이미 있는 NPC 키입니다: {key}"
  write-failed: "&cnpcs.yml 에 쓰지 못했습니다: {error}"
  unknown-key: "&c'{key}' 라는 NPC 가 npcs.yml 에 없습니다. (/엔피씨 목록)"
  moved: "&a[NPC] {key} 를 지금 위치로 옮겼습니다."
  removed: "&a[NPC] {key} 를 삭제했습니다."
  added: "&a[NPC] {key} ({name}&a) 를 추가했습니다. 대화는 conversations/{key}.yml 에 만든 뒤 /bq reload"


# ---- 사이드바 (화면 오른쪽 정보창) ----
# 한 줄이 목록 하나이고, 위에서부터 차례로 표시됩니다. (최대 15줄까지 보입니다)
# 빈 줄은 " " (공백 한 칸) 으로 적습니다.
# 쓸 수 있는 자리:
#   {player} {level} {club} {cooldown}
#   {exp} {exp-required} {exp-percent} {exp-bar}      경험치 (숫자, 퍼센트, 막대)
#   {mp} {max-mp} {mp-bar}                            마나 (숫자, 막대)
#   {str} {dex} {int} {hp} {wis}                      스탯 (기본 화면에서는 /stat 으로 보므로 쓰지 않음)
# 동아리 랭킹은 여기가 아니라 월드 랭킹판(ranking.yml)에 표시합니다.
scoreboard:
  title: "&6&lISHS RPG"
  lines:
    - "&e{player} &7Lv.{level}"
    - "&8━━━━━━━━━━━━━━"
    - "&f소속 &8» &e{club}"
    - " "
    - "&aEXP &7{exp-percent}%"
    - "{exp-bar}"
    - "&bMP &7{mp}/{max-mp}"
    - "{mp-bar}"
    - " "
    - "&f스킬 &8» {cooldown}"
  club-none: "&7없음"                     # 동아리가 없을 때 {club}
  skill-ready: "&a사용 가능"                # 스킬을 쓸 수 있을 때 {cooldown}
  cooldown: "&e쿨타임 {seconds}초"          # 스킬 쿨타임 중일 때 {cooldown}
  # 막대 그래프 모양 ({exp-bar}, {mp-bar})
  bar-length: "10"                         # 칸 수
  bar-char-filled: "▰"                     # 채워진 칸 모양
  bar-char-empty: "▱"                      # 빈 칸 모양
  bar-exp-color: "&a"                      # 경험치 막대 색
  bar-mp-color: "&b"                       # 마나 막대 색
  bar-empty-color: "&8"                    # 빈 칸 색


# ---- 랭킹판 (/랭킹판, 관리자 전용) ----
ranking-board:
  usage:
    - "&e/랭킹판 설치&7 - 바라보는 벽에 동아리 랭킹판을 붙임"
    - "&e/랭킹판 삭제&7 - 랭킹판 삭제"
    - "&7크기, 문구, 갱신 주기는 ranking.yml 을 고친 뒤 /설정리로드"
  look-at-wall: "&c벽(블록의 옆면)을 바라보고 다시 입력해 주세요. (12칸 이내)"
  installed: "&a[랭킹판] {x}, {y}, {z} 에 설치했습니다. 위치가 어색하면 다른 벽을 보고 다시 설치하세요."
  removed: "&a[랭킹판] 삭제했습니다."
  write-failed: "&cranking.yml 에 쓰지 못했습니다: {error}"


# ---- Tab 목록 (Tab 키를 눌렀을 때 위/아래 문구) ----
