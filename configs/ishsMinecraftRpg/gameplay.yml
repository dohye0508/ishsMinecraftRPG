# ============================================================
#  게임 수치와 규칙 (기획팀이 직접 수정하는 파일)
# ============================================================
#  - 스탯 공식, 레벨, 보상, 게임 규칙의 숫자는 모두 여기서 정합니다. (코드 수정 필요 없음)
#  - 값을 고친 뒤 게임에서 OP가  /설정리로드  를 입력하면 적용됩니다.
#    (이미 접속 중인 플레이어의 최대 HP/MP, 걷기 속도는 다음 접속이나 스탯 변경 때 다시 계산됩니다)
#  - 이 파일에서 값이 빠져 있으면 플러그인에 들어 있는 기본값이 쓰입니다.
#  - 문구(알림 메시지, GUI 제목 등)는 messages.yml, 동아리는 clubs.yml 에서 수정합니다.
# ============================================================


# ------------------------------------------------------------
#  1. 스탯
# ------------------------------------------------------------
stats:
  # 새 캐릭터가 처음 받는 자유 분배 포인트
  starting-points: 5

  # /stat GUI 에서 클릭할 때 한 번에 올라가는 양
  click-amount: 1          # 좌클릭
  shift-click-amount: 10   # Shift + 좌클릭

  # /stat GUI 모양
  gui:
    size: 54               # 칸 수 (9의 배수)
    info-slot: 4           # 플레이어 정보 아이템 칸 번호

  # 5대 스탯의 이름, 아이콘, 위치, 시작 값
  # 스탯 ID(str, dex, intel, hp, wis)는 코드에 연결되어 있어 바꿀 수 없습니다.
  attributes:
    str:                   # 힘
      label: "근력"         # 짧은 이름 (동아리 보너스 설명 등에 쓰임)
      gui-name: "근력 (STR)"  # /stat GUI 아이템 이름
      material: REDSTONE   # GUI 아이콘
      slot: 20             # GUI 칸 번호
      starting: 1          # 새 캐릭터 시작 값
    dex:                   # 민첩
      label: "민첩"
      gui-name: "민첩 (DEX)"
      material: FEATHER
      slot: 21
      starting: 1
    intel:                 # 지능
      label: "지능"
      gui-name: "지능 (INT)"
      material: BOOK
      slot: 22
      starting: 1
    hp:                    # 체력
      label: "체력"
      gui-name: "체력 (HP)"
      material: APPLE
      slot: 23
      starting: 1
    wis:                   # 정신력
      label: "정신력"
      gui-name: "정신력 (WIS)"
      material: NETHER_STAR
      slot: 24
      starting: 1

  # 스탯 -> 능력치 공식
  max-hp:                  # 최대 HP = base + (체력 스탯 x per-point)
    base: 100
    per-point: 15
  max-mp:                  # 최대 MP = base + (지능 스탯 x per-point)
    base: 50
    per-point: 10
  walk-speed:              # 걷기 속도 = base + base x min(민첩 x bonus-per-dex-point, max-bonus-ratio)
    base: 0.2              # 마인크래프트 기본 걷기 속도
    bonus-per-dex-point: 0.0003   # 민첩 1당 증가 비율 (0.0003 = 0.03%)
    max-bonus-ratio: 0.5          # 최대 증가 비율 (0.5 = 50%)
  mana-regen:              # 초당 마나 재생 = base-per-second + (지능 스탯 x per-intel-point)
    base-per-second: 2
    per-intel-point: 0.2


# ------------------------------------------------------------
#  2. 레벨
# ------------------------------------------------------------
leveling:
  max-level: 100           # 이 레벨에 도달하면 더 이상 오르지 않음

  # 다음 레벨에 필요한 경험치 = floor(base x 현재레벨 ^ exponent)
  required-exp:
    base: 100
    exponent: 2.5

  # 레벨업 시 지급되는 스탯 포인트 계산
  #   총 포인트 = base + floor(새 레벨 / per-levels)
  #   자율 포인트 = 총 포인트 - (auto-ratio 몫을 5대 스탯 전부에 +1씩으로 계산한 값) - (job-ratio 몫)
  # ※ 주의: 지금 값에서는 이 계산 결과가 음수가 되어 레벨업할 때 스탯 포인트가 오히려 줄어듭니다.
  #   (기존 코드의 계산식을 그대로 옮긴 것입니다. 의도한 지급 규칙을 정해 주시면 코드를 맞추겠습니다)
  level-up-points:
    base: 5
    per-levels: 2
    auto-ratio: 0.2
    job-ratio: 0.3

  # 이 간격(레벨)마다 레벨업을 서버 전체에 알림. 0이면 알리지 않음
  broadcast-every-levels: 5

  # 레벨 도달 도전과제.  레벨: 도전과제 ID  (도전과제 내용은 achievements.yml)
  level-achievements:
    5: level_5
    10: level_10
    20: level_20
    50: level_50


# ------------------------------------------------------------
#  3. 보상
#  achievement 에는 achievements.yml 의 도전과제 ID 를 적습니다. 비워 두면(빈 문자열) 도전과제 없음.
# ------------------------------------------------------------
rewards:
  # 플레이어가 무언가를 처치했을 때
  kill:
    exp: 10
    stat-point-chance: 0.2     # 스탯 포인트를 받을 확률 (0.2 = 20%)
    stat-points: 1             # 받을 때 지급량
    achievement: first_kill

  # 블록 채굴 보상. 서바이벌에서는 블록을 부술 수 없으므로(rules.survival-block-break: false),
  # 지금은 서바이벌이 아닌 모드(크리에이티브 등)에서만 받을 수 있습니다. 서바이벌에서도 받게 하려면 그 규칙을 true 로 바꾸세요.
  mining:
    exp: 2
    stat-point-chance: 0.05
    stat-points: 1
    # 특정 블록에 대한 추가 보상. blocks(블록 이름 목록) 또는 name-contains(이름에 포함된 글자)로 지정
    special:
      - blocks: [DIAMOND_ORE, DEEPSLATE_DIAMOND_ORE]
        exp: 30
        achievement: diamond
      - name-contains: LOG
        exp: 0
        achievement: lumberjack

  # 플레이어가 죽었을 때
  death:
    achievement: first_death

  # 다른 동아리 플레이어를 처치했을 때 (도전과제를 처음 달성할 때 한 번만 포인트 지급)
  pvp-win:
    achievement: pvp_win
    stat-points: 5

  # 같은 동아리원이 근처에 있을 때 몬스터를 처치하면
  club-coop:
    radius: 15                 # 근처로 보는 거리 (블록)
    exp: 5                     # 함께 있던 동아리원이 받는 경험치
    achievement: club_coop


# ------------------------------------------------------------
#  4. 게임 규칙 (true / false)
# ------------------------------------------------------------
rules:
  survival-block-break: false  # true: 서바이벌에서도 블록을 부술 수 있음
  spawn-animals: false         # true: 동물과 박쥐가 자연 스폰됨
  allow-time-skip: false       # true: 수면 등으로 밤을 건너뛸 수 있음
  hunger-loss: false           # true: 배고픔 게이지가 줄어듦
  explosion-block-damage: false  # true: 폭발이 블록을 부숨
  glowing-players: true        # true: 인증을 마친 플레이어에게 발광 효과 (이름표/윤곽 표시)
  pvp:
    require-club: true         # true: 동아리가 없는 플레이어는 PvP 불가
    block-same-club: true      # true: 같은 동아리끼리는 PvP 불가


# ------------------------------------------------------------
#  5. 월드 설정
#  게임 규칙 이름은 대문자 영어(예: KEEP_INVENTORY)로 적고, 값은 true/false 또는 숫자입니다.
#  이름이 틀리면 그 규칙만 무시되고 서버 콘솔에 [gameplay.yml] 경고가 나옵니다.
# ------------------------------------------------------------
world:
  game-rules:                  # 모든 월드에 적용
    KEEP_INVENTORY: true
    MOB_GRIEFING: false
    DO_FIRE_TICK: false
    NATURAL_REGENERATION: false  # 자연 회복 끔 (커스텀 회복 사용)
    RANDOM_TICK_SPEED: 3
    ANNOUNCE_ADVANCEMENTS: false
  overworld-game-rules:        # 오버월드에만 추가로 적용
    DO_DAYLIGHT_CYCLE: true
    DO_WEATHER_CYCLE: false
  clear-weather: true          # 오버월드의 비/천둥을 맑게 고정
