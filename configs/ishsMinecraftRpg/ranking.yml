# ============================================================
#  동아리 랭킹판 (기획팀이 직접 수정하는 파일)
# ============================================================
#  - 월드에 떠 있는 큰 글씨로 동아리 점수 순위를 보여 줍니다. (화면 오른쪽 정보창에는 더 이상 표시하지 않습니다)
#  - 위치는 게임에서 명령으로 정합니다. 붙이고 싶은 벽을 바라보고  /랭킹판 설치  를 입력하면
#    이 파일의 world, location 이 자동으로 적힙니다. (없애려면 /랭킹판 삭제)
#  - 나머지는 이 파일에서 고치고 OP가  /설정리로드  를 입력하면 적용됩니다.
#
#    enabled         false 면 랭킹판을 보여 주지 않음
#    update-seconds  순위를 새로 그리는 간격(초)
#    scale           글씨 크기 배율 (1 = 기본, 2 = 2배). 너무 크면 줄이세요
#    brightness      글씨 자체 밝기 0~15 (15 = 가장 밝음, 어두운 곳에서도 잘 보임). -1 이면 주변 밝기를 따름
#    background      true 면 글씨 뒤에 반투명 검은 배경
#    title           맨 윗줄 제목. 비우면 제목 없음 (색상 코드 & 사용 가능)
#    line            순위 한 줄의 모양. 동아리 수만큼 위에서부터 반복됩니다.
#                      {rank} 순위  {club} 동아리(색+아이콘+이름)  {score} 점수
#                    점수가 같으면 clubs.yml 의 순서를 따릅니다.
#
#  ※ 현재는 동아리 점수가 오르는 규칙이 없어 모두 0점으로 보입니다. (점수 규칙이 생기면 자동 반영)
# ============================================================

enabled: true
update-seconds: 5
scale: 2
brightness: 15
background: true
title: "&6&l동아리 랭킹"
line: "&f{rank}위 {club} &f{score}점"
world: "world"
location: {x: 294.03, y: -60.49, z: 163.56, yaw: -90}
