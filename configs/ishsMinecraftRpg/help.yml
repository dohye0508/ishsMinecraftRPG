# ============================================================
#  /도움말 문구 (기획팀이 직접 수정하는 파일)
# ============================================================
#  - 한 줄이 목록 하나입니다. 빈 줄은 "" 로 적습니다.
#  - 색상 코드를 쓸 수 있습니다. 앞에 & 를 붙입니다.
#      &6 금색  &e 노랑  &a 연두  &b 하늘  &c 빨강  &7 회색  &8 진회색  &f 흰색
#  - 값을 고친 뒤 게임에서 OP가  /설정리로드  를 입력하면 적용됩니다.
#  - 큰따옴표(") 안에 큰따옴표를 쓰고 싶으면 앞에 \ 를 붙이세요.
#
#  lines     모든 플레이어에게 보이는 부분
#  op-lines  OP(관리자)에게만 추가로 보이는 부분
#  footer    맨 마지막 줄들 (모든 플레이어)
# ============================================================

lines:
  - "&6================= [ 인곽 RPG 도움말 ] ================="
  - ""
  - "&e📜 [ 유저 기본 명령어 ]"
  - "&a/lobby &8(또는 /l) &f- 중앙 로비(본관 1층)로 즉시 이동"
  - "&a/stat &8(또는 /스탯) &f- 내 정보 및 스탯 포인트 투자 GUI 열기"
  - "&a/도전과제 &8(또는 /업적) &f- 내 도전과제(업적) 목록 GUI 열기"
  - "&a/인증 &f- 리로스쿨 계정 재인증 진행"
  - ""
  - "&b💡 [ 게임 플레이 핵심 팁 ]"
  - "&7• &f스킬 발동: &7동아리 가입 후 &aShift + F &7키를 눌러 고유 스킬(마나 소모)을 사용합니다!"
  - "&7• &f퀘스트 진행: &7머리 위에 이름이 떠 있는 NPC를 &e우클릭&7하면 대화가 시작됩니다."

op-lines:
  - ""
  - "&c👑 [ OP/관리자 전용 외부 플러그인 가이드 ]"
  - "&7[1] NPC 만들기 (Citizens)"
  - "&f  - /npc create [이름] &7: 바라보는 곳에 NPC를 스폰합니다."
  - "&f  - /npc select &7: 이전에 만든 NPC를 선택합니다. (명령어 사용시 필수)"
  - "&f  - /npc skin [스킨닉네임] &7: NPC에게 예쁜 마크 스킨을 입힙니다."
  - "&f  - /npc look &7: 플레이어가 다가가면 고개를 돌려 쳐다보게 합니다."
  - ""
  - "&7[2] NPC에 대화/퀘스트 넣기 (BetonQuest)"
  - "&f  * BetonQuest 3.x 버전은 명령어 대신 &emain.yml&f 파일을 직접 수정합니다."
  - "&f  - 서버 폴더: plugins/BetonQuest/QuestPackages/default/main.yml 열기"
  - "&f  - 맨 아래에 다음 내용 추가: "
  - "&7     npcs:"
  - "&7       '0': tutorial  (0은 NPC ID, tutorial은 대화파일 이름)"
  - "&f  - 파일을 저장하고 &a/bq reload&f 를 치면 즉시 적용됩니다!"

footer:
  - ""
  - "&6=================================================="
