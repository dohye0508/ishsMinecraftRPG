# ============================================================
#  NPC 목록 (기획팀이 직접 수정하는 파일)
# ============================================================
#  - 이 파일이 기준입니다. 서버를 켜거나 OP가  /설정리로드  를 입력하면 게임 안 NPC가 이 목록대로 맞춰집니다.
#      목록에 추가 -> NPC 생성 / 좌표·이름 수정 -> NPC 이동·이름 변경 / 목록에서 삭제 -> NPC 삭제
#  - 게임에서 /npc 명령으로 직접 만든 NPC는 건드리지 않습니다. (이 파일에 있는 NPC만 관리합니다)
#  - 위치는 게임에서 명령으로 관리합니다. (좌표를 직접 적을 필요 없음, 명령을 쓰면 이 파일의 좌표도 자동으로 바뀝니다)
#      /엔피씨 추가 [키] [이름]   서 있는 자리에 NPC 추가 (이 파일 맨 아래에 항목이 적힙니다)
#      /엔피씨 이동 [키]          NPC를 지금 서 있는 자리로 이동
#      /엔피씨 삭제 [키]          NPC 삭제
#    이름, 스킨은 이 파일에서 고치고 /설정리로드 로 적용합니다.
#  - 항목은 반드시 맨 아래(npcs: 아래)에 둡니다.
#
#  항목 설명
#    (맨 위) 키     NPC의 고유 이름. 영어 소문자/숫자/밑줄, 띄어쓰기 없음. 예) vice_principal
#    name           NPC 머리 위에 보이는 이름 (색상 코드 & 사용 가능)
#    type           NPC 모습. 기본 PLAYER(사람). CAT(고양이) 등 동물 이름도 가능 (대문자, 마인크래프트 엔티티 이름)
#    skin           스킨으로 쓸 마인크래프트 닉네임 (type 이 PLAYER 일 때만 적용). 없으면 줄 삭제
#    variant        type 이 CAT 일 때 고양이 무늬: TABBY, BLACK, RED, SIAMESE, BRITISH_SHORTHAIR, CALICO, PERSIAN, RAGDOLL, WHITE, JELLIE, ALL_BLACK
#    sitting        true면 앉은 자세 (고양이 등, 기본 false)
#    world          NPC가 있는 월드 이름. 없으면 기본 월드(오버월드)
#    location       x, y, z 좌표와 바라보는 방향 yaw (0 남쪽, 90 서쪽, 180 북쪽, 270 동쪽)
#    look-at-player true면 가까이 온 플레이어를 바라봄 (기본 true)
#    conversation   우클릭했을 때 시작되는 대화 이름. BetonQuest 의
#                   QuestPackages/default/conversations/<대화 이름>.yml 파일과 같아야 합니다. (기본: NPC 키와 동일)
#
#  offset: 맵 위치가 바뀌었을 때 아래 모든 NPC의 좌표를 한 번에 옮깁니다. (x, y, z에 더해짐. 평소엔 0)
#
#  대화, 퀘스트 수정은 BetonQuest 파일에서 하고  /bq reload  로 적용합니다. (docs/기획팀_가이드.md 참고)
# ============================================================

offset:
  x: 0
  y: 0
  z: 0

npcs:
  principal:
    name: "&6교장선생님"
    skin: Notch
    location: {x: 305.26, y: -61.00, z: 153.34, yaw: -178}
    look-at-player: true
    conversation: principal

  vice_principal:
    name: "&e교감선생님"
    skin: jeb_
    location: {x: 309.5, y: -61, z: 160.5, yaw: 0}
    look-at-player: true
    conversation: vice_principal

  incheon_science_cat:
    name: "&6인천과학고양이"
    type: CAT
    variant: BRITISH_SHORTHAIR
    location: {x: 307.5, y: -61, z: 160.5, yaw: 0}   # 임시 좌표: /엔피씨 이동 incheon_science_cat
    look-at-player: true
    conversation: incheon_science_cat
