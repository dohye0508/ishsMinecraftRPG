# ============================================================
#  ishsMinecraftRpg 설정 파일 (기획팀이 직접 수정하는 파일)
# ============================================================
#  - 좌표는 모두 "블록 좌표"입니다. 게임에서 F3을 눌렀을 때 보이는 정수 좌표(XYZ)를 그대로 적으세요.
#  - 값을 고친 뒤에는 게임 안에서 OP가  /설정리로드  를 입력하면 서버 재시작 없이 적용됩니다.
#  - 맵(월드)을 바꾸면 아래 좌표들이 맞는지 반드시 다시 확인하세요.
#  - 자세한 사용법: 기획팀_가이드.md
# ============================================================


# ------------------------------------------------------------
#  1. 리로스쿨 인증
# ------------------------------------------------------------
auth:
  # true: 접속할 때 리로스쿨 인증을 해야 플레이할 수 있습니다.
  # false: 인증 없이 바로 입장합니다. (맵 수정/테스트할 때 끄세요)
  enabled: true

  # 인증 대기소 위치입니다. 맵 경계(border) 밖에 두면 됩니다.
  room:
    x: 231
    y: -61
    z: 363

  # 인증하는 동안 움직일 수 있는 범위입니다. 대기소를 중심으로 한 변의 길이(블록)입니다.
  # 예) 15 -> 15x15 정사각형 안에서만 이동 가능
  lock-size: 15


# ------------------------------------------------------------
#  2. 최초 스폰
# ------------------------------------------------------------
spawn:
  # 처음 접속한 플레이어가 인증 후 나타나는 곳이자, 월드 스폰 지점(/lobby, 부활 위치)입니다.
  first:
    x: 305
    y: -61
    z: 156


# ------------------------------------------------------------
#  3. 맵 경계 (직사각형)
# ------------------------------------------------------------
border:
  # true: 아래 영역 밖으로 나갈 수 없고, 가까이 가면 파란 월드보더 벽이 보입니다.
  # false: 경계를 쓰지 않습니다.
  enabled: true

  # 영역의 대각선 꼭짓점 두 곳입니다. (순서는 상관없고, 양 끝 블록도 영역에 포함됩니다)
  # 예) x 20~550, z 15~220 영역
  corner1:
    x: 20
    z: 220
  corner2:
    x: 550
    z: 15


# ------------------------------------------------------------
#  4. /퀘스트 에 보여줄 퀘스트 이름
# ------------------------------------------------------------
# 형식:  BetonQuest 오브젝티브 ID: "화면에 보여줄 이름"
# 오브젝티브 ID는 BetonQuest/QuestPackages/default/main.yml 의 objectives 항목에 있는 이름과 같아야 합니다.
# 새 퀘스트를 만들면 여기에 한 줄만 추가하면 /퀘스트 목록에 나타납니다.
quests:
  logic_quest_obj: "LOGIC 부짱 - 좀비 사냥"
  win_quest_obj: "WIN 부짱 - 스켈레톤 사냥"
  tnt_quest_obj: "TNT 부짱 - 크리퍼 사냥"
  lottol_quest_obj: "LOTTOL 부짱 - 거미 사냥"
  quasar_quest_obj: "QUASAR 부짱 - 돌 채굴"
  raibit_quest_obj: "RAIBIT 부짱 - 레드스톤 광석 채굴"
  plutonium_quest_obj: "PLUTONIUM 부짱 - 철 광석 채굴"
  dorm1_quest_obj: "1학년 사감쌤 - 빵 제작"
  dorm2_quest_obj: "2학년 사감쌤 - 다이아몬드 채굴"


# ------------------------------------------------------------
#  5. 캐릭터 최초 생성 스탯
# ------------------------------------------------------------
# 캐릭터 최초 생성 시 기본 스탯과 자유 분배 포인트입니다.
# 이미 생성된 캐릭터에는 영향을 주지 않습니다.
starting-stats:
  str: 1
  dex: 1
  intel: 1
  hp: 1
  wis: 1

starting-stat-points: 5
